
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Student Attendance Scanner</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #reader {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #reader__scan_region {
      background: transparent !important;
    }

    #reader__dashboard {
      display: none !important;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 14px;
      text-align: center;
      color: white;
      background: rgba(0,0,0,0.65);
      font-size: 18px;
      font-weight: bold;
    }

    .scan-frame {
      position: fixed;
      z-index: 5;
      width: 72vw;
      height: 72vw;
      max-width: 360px;
      max-height: 360px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border: 3px solid #00ff88;
      border-radius: 18px;
      pointer-events: none;
      box-shadow: 0 0 15px rgba(0,255,136,0.35);
    }

    .bottom-panel {
      position: fixed;
      z-index: 10;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px;
      color: white;
      text-align: center;
      background: rgba(0,0,0,0.78);
    }

    #status {
      font-size: 16px;
      margin-bottom: 10px;
      min-height: 22px;
    }

    #studentInfo {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 10px;
      color: #00ff88;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #00c853;
      color: white;
    }

    #stopBtn {
      background: #e53935;
      color: white;
    }

    #fullBtn {
      background: #1976d2;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
    }
  </style>
</head>

<body>

  <div id="reader"></div>

  <div class="topbar">
    Student Attendance Scanner
  </div>

  <div class="scan-frame"></div>

  <div class="bottom-panel">
    <div id="status">ক্যামেরা চালু করতে Start Camera চাপুন।</div>

    <div id="studentInfo"></div>

    <div class="buttons">
      <button id="startBtn" onclick="startCamera()">Start Camera</button>
      <button id="stopBtn" onclick="stopCamera()" disabled>Stop Camera</button>
      <button id="fullBtn" onclick="goFullScreen()">Full Screen</button>
    </div>
  </div>

<script>
  // Google Apps Script Web App URL
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzqP8mTF_tUokTCqnwEiH_Jf9VGVw4DXz6L-fbLi95LHuORCKoPPXI4X7TimUAsRbwG/exec";

  let scanner = null;
  let cameraRunning = false;
  let processing = false;
  let lastScanned = "";
  let lastScanTime = 0;

  const statusBox = document.getElementById("status");
  const studentInfo = document.getElementById("studentInfo");
  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");

  function setStatus(message, color = "white") {
    statusBox.textContent = message;
    statusBox.style.color = color;
  }

  function beep() {
    try {
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.frequency.value = 1000;
      gain.gain.value = 0.15;

      oscillator.start();

      setTimeout(() => {
        oscillator.stop();
        audioContext.close();
      }, 180);
    } catch (e) {
      console.log("Beep error:", e);
    }
  }

  function thankYouVoice() {
    try {
      if ("speechSynthesis" in window) {
        const message = new SpeechSynthesisUtterance("Thank you");
        message.lang = "en-US";
        message.rate = 1;
        speechSynthesis.speak(message);
      }
    } catch (e) {
      console.log("Voice error:", e);
    }
  }

  function scanWithServer(studentId) {
    return new Promise((resolve, reject) => {
      const callbackName = "attendanceCallback_" + Date.now() + "_" + Math.floor(Math.random() * 10000);
      const script = document.createElement("script");

      const timeout = setTimeout(() => {
        cleanup();
        reject(new Error("সার্ভার থেকে উত্তর পাওয়া যায়নি।"));
      }, 15000);

      function cleanup() {
        clearTimeout(timeout);
        delete window[callbackName];
        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }
      }

      window[callbackName] = function(response) {
        cleanup();
        resolve(response);
      };

      script.onerror = function() {
        cleanup();
        reject(new Error("সার্ভারের সাথে সংযোগ করা যায়নি।"));
      };

      script.src =
        SCRIPT_URL +
        "?action=scan" +
        "&studentId=" + encodeURIComponent(studentId) +
        "&callback=" + encodeURIComponent(callbackName);

      document.body.appendChild(script);
    });
  }

  async function onScanSuccess(decodedText) {
    const now = Date.now();

    if (processing) return;

    // একই QR বারবার দ্রুত স্ক্যান হওয়া আটকাবে
    if (decodedText === lastScanned && now - lastScanTime < 3000) {
      return;
    }

    processing = true;
    lastScanned = decodedText;
    lastScanTime = now;

    setStatus("Attendance যাচাই হচ্ছে...", "#ffeb3b");
    studentInfo.textContent = "";

    try {
      const result = await scanWithServer(decodedText);

      if (result.success) {
        if (result.duplicate) {
          setStatus(result.message || "আজকের Attendance আগে দেওয়া হয়েছে।", "#ff9800");
          studentInfo.textContent =
            (result.name || "") + " | Roll: " + (result.roll || "");
        } else {
          setStatus(result.message || "Attendance সফলভাবে সংরক্ষণ হয়েছে।", "#00ff88");

          studentInfo.textContent =
            "Name: " + (result.name || "") +
            " | Roll: " + (result.roll || "") +
            " | Class: " + (result.class || "");

          beep();
          thankYouVoice();
        }
      } else {
        setStatus(result.message || "Student পাওয়া যায়নি।", "#ff5252");
      }

    } catch (error) {
      setStatus(error.message || "কিছু সমস্যা হয়েছে।", "#ff5252");
    }

    // পরবর্তী QR স্ক্যানের জন্য সামান্য বিরতি
    setTimeout(() => {
      processing = false;
    }, 1200);
  }

  async function startCamera() {
    if (cameraRunning) return;

    try {
      setStatus("ক্যামেরা চালু হচ্ছে...", "#ffeb3b");

      scanner = new Html5Qrcode("reader");

      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 12,
          qrbox: function(viewfinderWidth, viewfinderHeight) {
            const size = Math.floor(
              Math.min(viewfinderWidth, viewfinderHeight) * 0.72
            );
            return { width: size, height: size };
          },
          aspectRatio: 1.0
        },
        onScanSuccess,
        function() {}
      );

      cameraRunning = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;

      setStatus("ক্যামেরা চালু আছে। QR Code স্ক্যান করুন।", "#00ff88");

    } catch (error) {
      console.error(error);
      setStatus("ক্যামেরা চালু হয়নি। Camera Permission দিন।", "#ff5252");
    }
  }

  async function stopCamera() {
    if (!scanner || !cameraRunning) return;

    try {
      await scanner.stop();
      await scanner.clear();

      scanner = null;
      cameraRunning = false;
      processing = false;

      startBtn.disabled = false;
      stopBtn.disabled = true;

      setStatus("ক্যামেরা বন্ধ আছে।", "white");
      studentInfo.textContent = "";

    } catch (error) {
      console.error(error);
      setStatus("ক্যামেরা বন্ধ করতে সমস্যা হয়েছে।", "#ff5252");
    }
  }

  async function goFullScreen() {
    try {
      if (!document.fullscreenElement) {
        await document.documentElement.requestFullscreen();
      } else {
        await document.exitFullscreen();
      }
    } catch (error) {
      console.log("Fullscreen not supported:", error);
    }
  }
</script>

</body>
</html>
